# ---------------------------------------------------------------------------
# Defaults applied to EVERY note in this folder. Individual notes can override
# any of these in their own YAML header.
# ---------------------------------------------------------------------------

author: "Riccardo Reho"

format:
  html:
    toc: true
    toc-depth: 3
    toc-expand: true
    number-sections: true
    html-math-method: katex
    fig-cap-location: bottom
    code-tools: false # set true to expose a "view source" button
    code-link: false

execute:
  freeze: auto # never re-run code unless the source file changed
  echo: true # show the code alongside its output
  warning: false
