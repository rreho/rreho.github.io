<div class="content-page">
  <mat-card class="header-card">
    <mat-card-header>
      <mat-card-title>My Thoughts</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>A personal collection of thoughts, reflections, and ideas on physics, research, and life.</p>
    </mat-card-content>
  </mat-card>

  <div class="thoughts-container">
    <div *ngIf="thoughts.length > 0" class="thoughts-grid">
      <mat-card *ngFor="let thought of thoughts" class="thought-card">
        <mat-card-header>
          <mat-card-title>{{ thought.title }}</mat-card-title>
          <mat-card-subtitle>
            <span class="label-badge">{{ thought.label }}</span>
            <span class="date">{{ thought.date }}</span>
          </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <img *ngIf="thought.imageUrl" [src]="thought.imageUrl" alt="Thought image" class="thought-image">
          <p>{{ thought.content }}</p>
        </mat-card-content>
      </mat-card>
    </div>

    <mat-card *ngIf="thoughts.length === 0" class="empty-state">
      <mat-card-content>
        <mat-icon>light_mode</mat-icon>
        <p>No thoughts yet.</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
